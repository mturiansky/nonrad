[tool.pdm]

[tool.pdm.dev-dependencies]
test = [
    "pytest>=7.3.1",
    "pytest-cov>=4.0.0",
    "coverage>=7.2.5",
]
docs = [
    "sphinx>=6.2.1",
    "sphinx-rtd-theme>=1.2.0",
]
lint = [
    "ruff>=0.0.264",
    "mypy>=1.2.0",
]

[tool.pdm.scripts]
lint = {composite = ["ruff check nonrad", "mypy nonrad"]}
test = "pytest -v nonrad"
all = {composite = ["lint", "test"]}

[project]
name = "nonrad"
version = "1.2.0"
description = "Implementation for computing nonradiative recombination rates in semiconductors"
authors = [
    {name = "Mark E. Turiansky", email = "mturiansky@ucsb.edu"},
]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = {text = "MIT"}
keywords = [
    "physics",
    "materials",
    "science",
    "VASP",
    "recombination",
    "Shockley-Read-Hall",
]
classifiers=[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.3",
    "scipy>=1.9.3",
    "pymatgen>=2023.3.23",
    "monty>=2023.4.10",
    "numba>=0.57.0",
    "mpmath>=1.3.0",
    "cyclopts>=3.24.0",
]

[project.urls]
documentation = "https://nonrad.readthedocs.io"
repository = "https://github.com/mturiansky/nonrad"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.scripts]
nonrad = "nonrad.__main__:app"

[tool.ruff]
line-length = 99
extend-exclude = ["docs", "notebooks"]

[tool.ruff.lint]
select = ["A", "B", "D", "E", "F", "I", "NPY", "PL", "UP", "W"]
ignore = ["PLR", "D100", "D101", "D104", "E731", "NPY201", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"nonrad/tests/**.py" = ["D102", "D103", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
ignore_missing_imports = "True"
plugins = "numpy.typing.mypy_plugin"
